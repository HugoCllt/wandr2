packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 enforces a default 24h minimum-release-age supply-chain policy.
# Disabled for this solo POC — it was a recurring false positive on
# fast-publishing browser-data packages (electron-to-chromium, caniuse-lite).
minimumReleaseAge: 0

# Moved from package.json's "pnpm" field, which pnpm 11 no longer reads.
# Pins better-call + @better-fetch/fetch to the versions better-auth@1.6.30 /
# @better-auth/expo@1.6.30 both depend on, so the whole workspace resolves a
# single copy of each instead of the type-incompatible duplicate pnpm creates
# when a stale @better-auth/cli devDependency pulls an older line.
overrides:
  better-call: 1.4.0
  '@better-fetch/fetch': 1.3.1

# Postinstall/native build scripts allowed to run. pnpm 11 replaced the old
# `onlyBuiltDependencies` array with this explicit allow-map. better-sqlite3
# is left false on purpose: it's an unused Better Auth transitive (we use the
# Prisma/Postgres adapter) and building it would require MSVC tooling.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  unrs-resolver: true
  better-sqlite3: false
